<div class="edm-toast edm-toast-{{ kind }}">
  <i class="fas {{ icon }}" style="margin-top:2px;"></i>
  <span class="edm-toast-text">{{ message }}</span>
  <button type="button" class="edm-toast-close" aria-label="Yopish" onclick="this.parentElement.remove()">
    <i class="fas fa-times"></i>
  </button>
</div>
