<header class="sbar">
  <a class="sbar-brand" href="{% url 'imtihon:my_exams' %}">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </span>
    <span class="sbar-text"><b>Imtihon tizimi</b><small>{{ student_name }} · {{ request.user.username }}</small></span>
  </a>
  <form class="inline-form" method="post" action="{% url 'imtihon:logout' %}">{% csrf_token %}
    <button class="btn btn-ghost sbar-out" type="submit">Chiqish</button>
  </form>
</header>
